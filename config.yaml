    longitude: 141.3545
  - name: San Francisco
    latitude: 37.7749
    longitude: -122.4194
  - name: Los Angeles
    latitude: 34.0522
    longitude: -118.2437
  - name: Seattle
    latitude: 47.6062
    longitude: -122.3321
  - name: New York
    latitude: 40.7128
    longitude: -74.0060
  - name: Vancouver
    latitude: 49.2827
    longitude: -123.1207
  - name: Toronto
    latitude: 43.6532
