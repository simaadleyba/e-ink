# E-Ink dashboard configuration (Waveshare 7.5", 800x480)

display:
  width: 800
  height: 480
  model: epd7in5_V2

# Font priority: IBM Plex Mono -> Google Sans Mono -> DejaVu Sans Mono
fonts:
  paths:
    - /usr/share/fonts/truetype/ibm-plex/IBMPlexMono-Regular.ttf
    - /usr/share/fonts/truetype/google/GoogleSansMono-Regular.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
  time_size: 118
  secondary_size: 28
  quote_size: 24
  sidebar_size: 20

timezones:
  local: America/Los_Angeles
  hong_kong: Asia/Hong_Kong
  boston: America/New_York

map:
  latitude: 37.7749
  longitude: -122.4194
  location_label: San Francisco
  # Stadia Stamen style; zoom 14 + render_scale 2 is tuned for 7.5" e-ink clarity.
  zoom: 14
  render_scale: 2
  tile_url_template: https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}.png
  api_key: null
  cache_ttl_hours: 24
  timeout_seconds: 12

quotes:
  source: local_json
  quotes_file: eink_dashboard/assets/quotes.json
  daily_seed: 0

layout:
  outer_margin: 22
  sidebar_width: 278
  separator_width: 2
  map_margin: 18

cache_dir: cache
