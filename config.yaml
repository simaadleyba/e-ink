quotes:
  source: local_json
  quotes_file: assets/quotes.json
  daily_seed: 0

layout:
  sidebar_width: 160
  sidebar_padding: 24
  divider_length: 48
  divider_thickness: 1
  world_block_gap: 18
  quote_bottom_padding: 22
  map_label_margin: 12

cache_dir: cache
