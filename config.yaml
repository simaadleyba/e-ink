# E-Ink dashboard configuration (Waveshare 7.5", 800x480)

display:
  width: 800
  height: 480
  model: epd7in5_V2

fonts:
  # IBM Plex Mono (light/regular/medium/italic) with fallback.
  light_paths:
    - /usr/share/fonts/truetype/ibm-plex/IBMPlexMono-Light.ttf
    - /usr/share/fonts/truetype/ibm-plex/IBMPlexMono-Regular.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
  regular_paths:
    - /usr/share/fonts/truetype/ibm-plex/IBMPlexMono-Regular.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
  medium_paths:
    - /usr/share/fonts/truetype/ibm-plex/IBMPlexMono-Medium.ttf
    - /usr/share/fonts/truetype/ibm-plex/IBMPlexMono-Regular.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
  italic_paths:
    - /usr/share/fonts/truetype/ibm-plex/IBMPlexMono-Italic.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSansMono-Oblique.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf

  local_time_size: 36
  local_ampm_size: 16
  date_size: 8
  world_label_size: 11
  world_time_size: 23
  world_ampm_size: 12
  quote_size: 15
  quote_author_size: 12
  map_label_size: 12
  map_coords_size: 10

timezones:
  local: Europe/Istanbul
  hong_kong: Asia/Hong_Kong
  boston: America/New_York
  seattle: America/Los_Angeles

map:
  # Stadia Stamen Toner @2x tiles.
  zoom: 14
  render_scale: 2
  tile_url_template: https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}@2x.png
  api_key: null
  cache_ttl_hours: 24
  timeout_seconds: 12
  user_agent: eink-dashboard/1.0 (+https://github.com/)

map_cities:
  - name: Istanbul
    latitude: 41.0082
    longitude: 28.9784
  - name: Boston
    latitude: 42.3601
    longitude: -71.0589
  - name: Tokyo
    latitude: 35.6762
    longitude: 139.6503
